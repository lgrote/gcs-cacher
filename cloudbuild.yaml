# CI: build and push the gcs-cacher builder image (Cloud Build restore/save cache step). Build only,
# no deploy. The image build runs tests, lint and govulncheck (Dockerfile), hence the bigger machine.
steps:
  # buildx with a layer cache in gcr.io/…/$REPO_NAME:buildcache. linux/amd64: the image runs as a
  # Cloud Build step, and Cloud Build workers are x86.
  - id: setup-buildx
    name: gcr.io/cloud-builders/docker
    args: ['buildx', 'create', '--use']
  - id: build-push
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --platform=linux/amd64
      - --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/$REPO_NAME:buildcache
      - --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/$REPO_NAME:buildcache,mode=max
      - --tag=gcr.io/$PROJECT_ID/$REPO_NAME:$SHORT_SHA
      # builder images are referenced as :latest from other repos' cloudbuild.yaml
      - --tag=gcr.io/$PROJECT_ID/$REPO_NAME:latest
      - --push
      - .
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
tags: ['$REPO_NAME', '$SHORT_SHA']
