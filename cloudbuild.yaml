# CI: build and push the gcs-cacher builder image (Cloud Build restore/save cache step). Build only,
# no deploy. The image build runs tests, lint and govulncheck (Dockerfile), hence the bigger machine.
steps:
  # buildx with a layer cache in europe-west3-docker.pkg.dev/…/buildcache/$REPO_NAME:buildcache, image in
  # …/images (both beside the Cloud Build region). linux/amd64: the image runs as a Cloud Build step, and
  # Cloud Build workers are x86.
  - id: setup-buildx
    name: gcr.io/cloud-builders/docker
    args: ['buildx', 'create', '--use']
  - id: build-push
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --platform=linux/amd64
      - --cache-from=type=registry,ref=europe-west3-docker.pkg.dev/$PROJECT_ID/buildcache/$REPO_NAME:buildcache
      - --cache-to=type=registry,ref=europe-west3-docker.pkg.dev/$PROJECT_ID/buildcache/$REPO_NAME:buildcache,mode=max
      - --tag=europe-west3-docker.pkg.dev/$PROJECT_ID/images/$REPO_NAME:$SHORT_SHA
      # builder images are referenced as :latest from other repos' cloudbuild.yaml
      - --tag=europe-west3-docker.pkg.dev/$PROJECT_ID/images/$REPO_NAME:latest
      - --push
      - .
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
tags: ['$REPO_NAME', '$SHORT_SHA']
